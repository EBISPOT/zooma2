
imageTag: dev
ingress:
  host: ""
  tlsSecretName: ""
nfsServer: hh-isi-srv-vlan1496.ebi.ac.uk
nfsDir: /ifs/public/rw/ontotools/zooma2/dev
dbPath: /data/zooma.db
olsUrl: https://wwwdev.ebi.ac.uk/ols4
corsAllowedOrigins: "https://www.ebi.ac.uk,https://wwwdev.ebi.ac.uk"
httpProxyHost: hh-wwwcache.ebi.ac.uk
httpProxyPort: 3128
httpsProxyHost: hh-wwwcache.ebi.ac.uk
httpsProxyPort: 3128
# EBI hosts (OLS on www/wwwdev) are reachable directly from the pods; going
# through the web cache as CONNECT tunnels added NoHttpResponse drops and
# retries under load, for no benefit.
nonProxyHosts: "localhost|127.0.0.1|*.cluster.local|*.svc|kubernetes|*.svc.cluster.local|*.ebi.ac.uk"

# Fixed node ports the EBI edge load balancer targets. These defaults are the
# dev cluster's; prod's differ (backend 32107, frontend 30572) and must be set
# on its release. A change here, or an unset value, breaks the public site.
backend:
  nodePort: 30502
frontend:
  nodePort: 31204
