# NodePort, not ClusterIP: the EBI edge load balancer that fronts
# www/wwwdev.ebi.ac.uk targets these services by fixed node port, so switching
# to ClusterIP (or letting Kubernetes allocate a port) takes the site down with
# a 500 from the edge. The ports differ per cluster and are set in the release
# values (backend.nodePort / frontend.nodePort); see values.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  type: NodePort
  ports:
  - name: "application"
    port: 8090
{{- if .Values.backend.nodePort }}
    nodePort: {{ .Values.backend.nodePort }}
{{- end }}
  selector:
    app: {{ .Release.Name }}-backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  type: NodePort
  ports:
  - name: "application"
    port: 8080
{{- if .Values.frontend.nodePort }}
    nodePort: {{ .Values.frontend.nodePort }}
{{- end }}
  selector:
    app: {{ .Release.Name }}-frontend
