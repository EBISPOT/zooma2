apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      securityContext:
        runAsUser: 5533
        runAsGroup: 1279
        fsGroup: 5533
      volumes:
        - name: {{ .Release.Name }}-import
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-import-pvc
      containers:
        - name: web
          image: ghcr.io/ebispot/zooma2_backend:{{.Values.imageTag}}
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: "/data"
              name: {{ .Release.Name }}-import
          ports:
            - containerPort: 8090
          resources:
            requests:
              memory: 16Gi
              cpu: 4
            limits:
              memory: 16Gi
              cpu: 4
          env:
            - name: ZOOMA2_CONTEXT_PATH
              value: /spot/zooma
            - name: ZOOMA2_CONFIG_PATH
              value: https://raw.githubusercontent.com/EBISPOT/zooma2/refs/heads/dev/config.json
            - name: ZOOMA2_DB_URL
              value: "jdbc:sqlite:{{.Values.dbPath}}"
            - name: ZOOMA2_OLS_URL
              value: {{ .Values.olsUrl | quote }}
            - name: JDK_JAVA_OPTIONS
              value: >-
                -XX:InitialRAMPercentage=60.0 -XX:MinRAMPercentage=60.0 -XX:MaxRAMPercentage=80.0
                -Dhttp.proxyHost={{ .Values.httpProxyHost }} -Dhttp.proxyPort={{ .Values.httpProxyPort }}
                -Dhttps.proxyHost={{ .Values.httpsProxyHost }} -Dhttps.proxyPort={{ .Values.httpsProxyPort }}
                -Dhttp.nonProxyHosts={{ .Values.nonProxyHosts }}
